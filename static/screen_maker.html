<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles/screen_maker.css">
    <script src="scripts/screen_maker.js"></script>
</head>
<body>


<div id="screen-maker-top-div">
    <div id="condition-popup" style="top: -10px;">
        <button id="condition-popup-add-button" class="add-button table-cell-button">Add Factor</button>
        <div id="condition-popup-tabulator"></div>
    </div>
    <div id="screen-maker-sidebar">
        <div id="automatic-maker-div" class="screen-maker-type-div"">
            <div id="screen-maker-import-div">
                <table id="screen-maker-import-button-table" class="button-table">
                    <tbody>
                    <tr>
                        <td><button id="screen-maker-import-button" class="table-cell-button">Import from file</button></td>
                        <td><button id="screen-maker-create-well-by-well-button" class="table-cell-button">Create well by well</button></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div id="automatic-maker-factor-groups-div">
                <h2 class="maker-title">Factor Groups</h2>
                <div id="screen-maker-automatic-generate-div">
                    <table id="automatic-generate-button-table" class="button-table">
                        <tbody>
                        <tr><td><button id="screen-maker-automatic-generate-button" class="table-cell-button">Generate Groups From Selected Wells</button></td></tr>
                        <tr><td><input id ="screen-maker-automatic-include-selected-checkbox" type="checkbox">Include Selected Well Conditions in New Screen</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="add-reload-banner">
                    <table id="maker-buttons" class="button-table add-reload-header-buttons-table">
                        <tbody>
                        <tr>
                            <td><button id="screen-maker-automatic-add-group-button" class="table-cell-button add-button">Add Group</button></td>
                            <td><button id="screen-maker-automatic-randomise-button" class="table-cell-button">Generate Screen</button></td>
                            <td><button id="screen-maker-automatic-clear-screen-button" class="table-cell-button">Clear Screen</button></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div id="holder-for-factor-group-tabulator" class="holder-for-automatic-maker-tabulator">
                    <div id="automatic-factor-groups-tabulator" class="object-for-tabulator"></div>
                </div>
            </div>
            <div id="automatic-maker-additive-div">
                <h2 class="maker-title">Additive</h2>
                <div class="holder-for-automatic-maker-tabulator">
                    <div id="automatic-additive-tabulator" class="object-for-tabulator"></div>
                </div>
            </div>
        </div>
    </div><div id="current-maker-div">
        <div id="current-maker-header">
            <h2 class="maker-title">New Screen</h2>
            <div id="holder-for-current-maker-details-tabulator">
                <div id="current-maker-details-tabulator" class="object-for-tabulator"></div>
            </div>
        </div><div id="current-maker-body">
            <div id="current-maker-controls">
                <button id="toggle-factor-numbers-button" class="table-cell-button" type="button">Show Factor Numbers</button>
                <button id="screen-maker-automatic-undo-button" class="table-cell-button" type="button">Undo</button>
            </div>
            <div id="current-maker-tabulator-automatic-update-popup" style="display: none;"><button id="current-maker-tabulator-automatic-update-popup-button">Regenerate Changes</button></div>
            <div id="holder-for-current-maker-tabulator">
                <div id="current-maker-tabulator" class="object-for-tabulator"></div>
            </div>
        </div>
        <div id="screen-maker-save-div">
            <table id="save-button-table" class="button-table">
                <tbody>
                <tr><td><button id="screen-maker-save-button" class="table-cell-button">Save<br><input type="checkbox">Check That Required Stocks Are Available</button></td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="screen-maker-import-popup" class="screen-maker-import-popup" style="display: none;">
        <h2>Import from file</h2>
        <p>Select a CrystalTrak or RockMaker XML design file.</p>
        <input id="screen-maker-import-file" type="file" accept=".txt,.xml,text/plain,application/xml,text/xml">
        <p id="screen-maker-import-status"></p>
        <button id="screen-maker-import-confirm-button" class="table-cell-button">Import</button>
        <button id="screen-maker-import-cancel-button" class="table-cell-button">Cancel</button>
    </div>
    <div id="screen-maker-import-review" class="screen-maker-import-review" style="display: none;">
        <div class="screen-maker-import-review-header">
            <div>
                <h2 id="screen-maker-import-review-title">Review imported screen</h2>
                <p id="screen-maker-import-review-name"></p>
                <p id="screen-maker-import-review-instructions">Edit imported factors below. Invalid factors are highlighted and must be corrected before submitting.</p>
                <p id="screen-maker-import-review-status" role="status"></p>
            </div>
        </div>
        <div id="screen-maker-import-review-table"></div>
        <div class="screen-maker-import-review-actions">
            <button id="screen-maker-import-submit-button" class="table-cell-button">Submit to Screen Maker</button>
            <button id="screen-maker-import-review-cancel-button" class="table-cell-button">Cancel</button>
        </div>
    </div>
    </div>

</body>
</html>
